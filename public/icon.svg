<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Obsidian to Institutional Forest Olive -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11161B" />
      <stop offset="50%" stop-color="#152119" />
      <stop offset="100%" stop-color="#0E1712" />
    </linearGradient>

    <!-- Metallic Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="35%" stop-color="#D97706" />
      <stop offset="70%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Algorithmic Laser Glow -->
    <linearGradient id="algoGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#FCD34D" />
    </linearGradient>

    <!-- Armor Shield Plate Gradient -->
    <linearGradient id="armorPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243328" />
      <stop offset="100%" stop-color="#17221A" />
    </linearGradient>

    <!-- Glow Filter for Laser & Signals -->
    <filter id="neonPulse" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background Rounded Tile -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  
  <!-- Outer Specular Bevel Border in Gold & Olive -->
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#goldRim)" stroke-width="3" stroke-opacity="0.4" />
  <rect width="480" height="480" x="16" y="16" rx="100" fill="none" stroke="#2D4734" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="16,8" />

  <!-- 2. Circuit Board Micro-Grid Trace Lines in Background -->
  <g opacity="0.18" stroke="#4ADE80" stroke-width="2" stroke-linecap="round">
    <path d="M 80 160 L 140 160 L 170 190" />
    <circle cx="80" cy="160" r="4" fill="#4ADE80" />
    <path d="M 432 160 L 372 160 L 342 190" />
    <circle cx="432" cy="160" r="4" fill="#4ADE80" />
    
    <path d="M 70 340 L 130 340 L 170 300" />
    <circle cx="70" cy="340" r="4" fill="#4ADE80" />
    <path d="M 442 340 L 382 340 L 342 300" />
    <circle cx="442" cy="340" r="4" fill="#4ADE80" />
  </g>

  <!-- 3. Central Algorithmic Trading Bot Emblem -->
  <g transform="translate(0, 4)">
    <!-- 24/7 Autonomous Radar Signal Waves (Top Antenna) -->
    <path d="M 226 88 A 36 36 0 0 1 286 88" fill="none" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" opacity="0.6" />
    <path d="M 210 74 A 56 56 0 0 1 302 74" fill="none" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    <circle cx="256" cy="106" r="6" fill="#FBBF24" />
    <line x1="256" y1="112" x2="256" y2="132" stroke="#FBBF24" stroke-width="4" stroke-linecap="round" />

    <!-- Autonomous Protective Shield (Capital Preservation) -->
    <path d="M 256 128 L 376 176 L 376 294 C 376 362 256 422 256 422 C 256 422 136 362 136 294 L 136 176 Z" 
          fill="url(#armorPlate)" 
          stroke="url(#goldRim)" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Shield Inner Geometric Layer -->
    <path d="M 256 148 L 354 188 L 354 286 C 354 340 256 392 256 392 C 256 392 158 340 158 286 L 158 188 Z" 
          fill="#101813" 
          stroke="#2D4734" 
          stroke-width="3" />

    <!-- Algorithmic Candlestick Sensors Inside Bot Helmet -->
    <!-- Candlestick 1 (Left Bullish Green) -->
    <line x1="192" y1="200" x2="192" y2="280" stroke="#10B981" stroke-width="3" />
    <rect x="184" y="218" width="16" height="42" rx="3" fill="#10B981" />

    <!-- Candlestick 2 (Right Bullish Green) -->
    <line x1="320" y1="190" x2="320" y2="270" stroke="#10B981" stroke-width="3" />
    <rect x="312" y="206" width="16" height="44" rx="3" fill="#10B981" />

    <!-- Center Bot Core / Cyber Head Armor -->
    <polygon points="256,174 308,206 308,290 256,322 204,290 204,206" 
             fill="#18251C" 
             stroke="#3E5C46" 
             stroke-width="3.5" 
             stroke-linejoin="round" />

    <!-- Bot Glowing HUD Visor (Execution Sensor) -->
    <rect x="214" y="234" width="84" height="26" rx="6" fill="#06120A" stroke="#4ADE80" stroke-width="2.5" />
    
    <!-- Algorithmic Execution Laser Pulse (The Pulse of Real-Time Trading) -->
    <path d="M 220 247 L 236 247 L 244 239 L 254 255 L 264 243 L 272 249 L 292 247" 
          fill="none" 
          stroke="url(#algoGlow)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neonPulse)" />

    <!-- Crosshair Target Center Node -->
    <circle cx="256" cy="247" r="3" fill="#FFFFFF" />

    <!-- Bottom Monogram "EMS" Inscribed in Gold -->
    <g transform="translate(256, 355)" text-anchor="middle">
      <rect x="-42" y="-14" width="84" height="22" rx="5" fill="#152119" stroke="#F59E0B" stroke-width="1.5" />
      <text y="2" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="800" fill="#FCD34D" letter-spacing="2">EMS</text>
    </g>

    <!-- Upward Execution Arrow (Alpha Profit Momentum) -->
    <path d="M 256 160 L 264 172 L 248 172 Z" fill="#FCD34D" />
  </g>
</svg>
